<!DOCTYPE html>
<html lang="tr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Day 08 - Form Validation</title>
    </head>
    <body>
        <h1>Kayıt Formu</h1>
        <form  id="kayitFormu">
            <div class="form-grup">
                <label for="ad">Ad</label>
                <input type="text" id="ad" name="ad" autocomplete="name">
                <p id="adHata" class="hata"></p>  
            </div>

            <div class="form-grup">
                <label for="email">E-posta</label>
                <input type="email" id="email" name="email" autocomplete="email">
                <p id="emailHata" class="hata"></p>
            </div>

            <div class="form-grup">
                <label for="sifre">Şifre</label>
                <input type="password" id="sifre" name="sifre" autocomplete="new-password">
                <p id="sifreHata" class="hata"></p>
            </div>

            <button type="submit">Kayıt Ol</button>

        </form>
            <p id="basariMesaji" class="basari"></p>

        <script src="script.js"></script>
    </body>
</html>
