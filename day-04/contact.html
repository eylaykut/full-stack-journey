<!DOCTYPE html>
<html lang="tr">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim</title>
</head>

<body>
    <header>
        <h1>iletişim</h1>
    <p>benimle iletişime geçebilirsiniz...</p>
    </header>
    <section>
        <div class="info-box">
            <p>Form şu anda yalnızca HTML ve CSS alıştırmasıdır. </p>

        </div>
        <form>
        <p>
            <label for="ad">Adın:</label>
            <input type="text" id="ad" name="ad" required>
        </p>

        <p>
            <label for="email">E-posta:</label>
            <input type="email" id="email" name="email" placeholder="ornek@example.com" required>
        </p>
        <p>
            <label for="mesaj">Mesajın:</label>
            <textarea id="mesaj" name="mesaj" rows="5" placeholder="Mesajını buraya yaz..." required></textarea>
        </p>
        <button type="submit">Gönder</button>
    </form>
    </section>
    <a href="index.html">ana sayfaya dön</a>
</body>

</html>
