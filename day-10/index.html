<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Day 10 - Harcama Takip Uygulaması </title>
</head>

<body>
    <h1>Harcama Takip Uygulaması</h1>
    <form id="spendings">
        <label for="spendingName">Harcama Adı</label>
        <input type="text" id="spendingName" placeholder="Örneğin: Market">

        <label for="spendingTotal">Harcama Tutarı</label>
        <input type="number" id="spendingTotal" placeholder="Örneğin: 750" min="0" step="0.01">

        <button type="submit">Harcama Ekle</button>
    </form>

    <h2>Harcamalar</h2>

    <ul id="harcamaListesi"></ul>

    <p id="toplamTutar">Toplam: 0 TL</p>

    <button type="button" id="tumunuSilButonu">Tümünü Sil</button>

    <script src="script.js"></script>
</body>

</html>
